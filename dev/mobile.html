<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>今天的小岛 · 手机预览</title>
    <style>
      :root {
        color-scheme: light;
        background: #e8eeea;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: 0;
        overflow: hidden;
        background: #e8eeea;
      }

      .mobile-preview {
        width: min(390px, 100vw);
        height: min(844px, 100dvh);
        overflow: hidden;
        background: #fffdfa;
        box-shadow: 0 18px 50px rgba(31, 65, 56, 0.16);
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      @media (max-width: 390px), (max-height: 844px) {
        body {
          place-items: stretch;
        }

        .mobile-preview {
          width: 100%;
          height: 100dvh;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="mobile-preview" aria-label="手机端预览">
      <iframe src="../index.html?v=monthly-41" title="今天的小岛手机端"></iframe>
    </main>
  </body>
</html>
