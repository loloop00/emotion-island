                    <rect class="stop-symbol" x="8" y="8" width="8" height="8" rx="1.5" />
                  </svg>
                </button>
              </div>
              <span class="sr-only" id="voice-status" aria-live="polite">语音输入已准备好</span>
              <span class="sr-only" id="voice-hint">文字输入默认开启，也可以使用麦克风</span>
